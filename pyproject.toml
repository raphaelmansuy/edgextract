[project]
name = "edgextract"
version = "0.1.0"
description = "Turn markdown into a knowledge graph with an ontology you write and a cutoff you own. Closed yes/no decisions, not free-form JSON."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Raphael MANSUY" }]
keywords = [
  "knowledge-graph",
  "information-extraction",
  "named-entity-recognition",
  "relation-extraction",
  "ontology",
  "ollama",
  "markdown",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.9",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]
spans = [
  "gliner2[local]>=2.0.0",
  "protobuf>=4",
  "transformers>=4.38,<5",
]

[project.urls]
Homepage = "https://github.com/raphaelmansuy/edgextract"
Repository = "https://github.com/raphaelmansuy/edgextract"

[project.scripts]
edgextract = "edgextract.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgextract"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
  "live: talks to a local Ollama at localhost:11434",
  "req: requirement id (REQ-n)",
  "ec: edge-case id (EC-n)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "examples", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"examples/_common.py" = ["E402"]
"examples/*.py" = ["E402"]
