# Publish edgextract to crates.io and @raphael.mansuy/edgextract to npm.
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Test
        run: cargo test --workspace && make wasm-check
      - name: Publish crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p edgextract --locked

  npm:
    runs-on: ubuntu-latest
    needs: crates
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install wasm-pack and a current npm
        run: |
          cargo install wasm-pack --locked
          npm install -g npm@11.6.2
      - name: Publish npm via GitHub OIDC (trusted publisher)
        run: |
          cd rust/edgextract-wasm && wasm-pack build --release --target bundler --scope raphael.mansuy --out-dir pkg --out-name edgextract
          python3 scripts/prepare_wasm_npm.py
          cd rust/edgextract-wasm/pkg && npm publish --access public
